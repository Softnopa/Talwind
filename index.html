<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <title>Task Master Pro</title>
</head>

<body class="bg-[radial-gradient(ellipse_at_top_left,_var(--tw-gradient-stops))] from-indigo-900 via-slate-900 to-black min-h-screen text-white antialiased">
    <div class="py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-2xl mx-auto">
            <header class="mb-10 text-center">
                <h1 class="text-5xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 to-cyan-400">Task Intelligence</h1>
                <p class="mt-3 text-slate-400 font-medium">Real-time resource synchronization dashboard.</p>
            </header>

            <div class="mb-8 relative group">
                <div class="absolute -inset-0.5 bg-gradient-to-r from-indigo-500 to-cyan-500 rounded-2xl blur opacity-20 group-hover:opacity-40 transition duration-1000"></div>
                <input type="number" id="search-id" class="js-search relative block w-full bg-slate-900/50 border border-slate-700 rounded-2xl py-4 px-6 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 backdrop-blur-xl transition-all" placeholder="Search by ID (e.g. 42)...">
            </div>

            <ul class="js-list space-y-4 perspective-1000">
                <!-- Dynamic items will be injected here -->
            </ul>
        </div>
    </div>

    <script src="main.js"></script>
</body>

</html>
